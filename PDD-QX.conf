# 拼多多去广告（QX 版）
# 由 Surge 版 PDD-Clean3.sgmodule 翻译，脚本为自制版 v3 的 QX 适配版（pdd-clean-qx.js）
# 用法：QX → 设置 → 重写 → 规则资源 → 添加本文件链接（或把规则行粘进 [rewrite_local]、hostname 粘进 [mitm]）
# 分流（promotion-2.pddpic.com 拦截）在另一个文件 PDD-QX-filter.snippet
#
# 翻译对照与差异：
# - Surge [Map Local] 开屏回 {} → QX reject-dict（200 + 空 JSON）
# - Surge [Map Local] 弹窗回空白 HTML 页 → QX reject-200（200 空响应，弹窗同样出不来；QX 无直接回自定义 HTML 的 rewrite 类型）
# - Surge [Script] http-response → QX script-response-body；Surge 的 max-size=1048576 在 QX 无对应参数，未带
# - 脚本适配：状态码改取 statusCode、URL 改手工解析；不写存储/不发请求，逻辑与 v3 一致，本地模拟 6 项全过
# - Surge 的 QUIC 按域名 REJECT QX 无等价写法：要掐 QUIC 只能 [general] 全局 udp_drop_list = QUIC（影响所有 App，按需自加，本文件不含）
# - 仍只删广告字段、不喂空响应、不拦遥测（旧 atopsecret 版喂空响应致死循环的教训）

# ===== 开屏与弹窗拦截（原 Map Local）=====
^https?://[^/]+/api/cappuccino/splash(?:[/?]|$) url reject-dict
^https?://m\.pinduoduo\.net(?::[0-9]+)?/vlayer_tab_popup\.html(?:\?|$) url reject-200

# ===== 字段清洗脚本（首页/个人/渲染/订单/搜索）=====
^https?://[^/]+/(?:api/(?:alexa/homepage/hub|philo/personal/hub|oak/integration/render|aristotle/order_list_v4)|order/|search)(?:[/?]|$) url script-response-body https://raw.githubusercontent.com/xchun5678/quantumultx/main/pdd-clean-qx.js

hostname = api.pinduoduo.com, api.yangkeduo.com, m.pinduoduo.net
