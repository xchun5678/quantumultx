# 小红书/RedNote 去水印去广告（QX 版）
# 由 Surge 版 RedNote-AllInOne.sgmodule 翻译，适配海外版 RedNote(rnote.com)
# 用法：QX → 设置 → 重写 → 规则资源 → 添加本文件链接（或把规则行粘进 [rewrite_local]、hostname 粘进 [mitm]）
# 分流（CDN 直连）在另一个文件 RedNote-QX-filter.snippet，粘进 [filter_local]
#
# 翻译对照：
# - Surge [Map Local] tiny-gif  → QX reject-img（同为 200 + 1px GIF）
# - Surge [Script] http-response → QX script-response-body
# - Surge [MITM] %APPEND%       → 本文件末尾 hostname 行
# - Surge 的 QUIC REJECT（按域名）QX 没有等价写法：QX 分流无 PROTOCOL 类型。
#   要掐 QUIC 只能在 [general] 全局加 udp_drop_list = QUIC（影响所有 App，按需自加，本文件不含）
#
# 未核实项：RedPaper_remove_ads.js 本体仍指向 kelee.one，该站对本机网络是 Cloudflare 硬拦截、
# 读不到源码，无法确认它内部是否用了 Surge 专有 API。若它为多端通用脚本则以下规则直接生效；
# 若在 QX 里不干活，先看 QX 日志里该脚本的报错，再决定换自制脚本。

# ===== 水印/广告配置拦截（原 Map Local）=====
^https:\/\/ci\.xiaohongshu\.com\/system_config\/watermark url reject-img
^https:\/\/ci\.rnote\.com\/system_config\/watermark url reject-img
^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/system\/config\/watermark url reject-img
^https:\/\/www\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/system_config\/watermark url reject-img
^https:\/\/ci\.(?:xiaohongshu|rnote)\.com\/system_config\/(?:advertise|splash) url reject-img

# ===== RedPaper 去广告/去水印（原版脚本，覆盖海外版 rnote 域名）=====
^https:\/\/edith\.rnote\.com\/api\/sns\/v1\/note\/(?:imagefeed|live_photo\/save)(\?|$) url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v1\/system\/service\/ui\/config\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v1\/system_service\/config\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v2\/system_service\/splash_config url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v2\/(?:note\/widgets|user\/followings\/followfeed) url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v4\/followfeed\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v5\/recommend\/user\/follow_recommend\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/edith\.rnote\.com\/api\/sns\/(?:v2\/note\/feed|v3\/note\/videofeed) url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/(?:edith|rec)\.rnote\.com\/api\/sns\/v6\/homefeed\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/(?:edith|so)\.rnote\.com\/api\/sns\/v10\/search\/notes\? url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js
^https:\/\/(?:edith|rec|www)\.rnote\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save) url script-response-body https://kelee.one/Resource/JavaScript/RedPaper/RedPaper_remove_ads.js

# ===== 评论实况补丁（自制脚本 QX 适配版：存储改 $prefs 双兼容）=====
# 注意：评论两个接口在 Surge 版里同时挂了 RedPaper 与补丁脚本；QX 一条规则只跑一个脚本，
# 这里只挂补丁脚本（它已含 red_id 改名与换流；须先滑过评论列表登记原流，再下载才换得到）
^https:\/\/edith\.rnote\.com\/api\/sns\/v5\/note\/comment\/list url script-response-body https://raw.githubusercontent.com/xchun5678/quantumultx/main/rednote-comment-fix-qx.js
^https:\/\/edith\.rnote\.com\/api\/sns\/v1\/interaction\/comment\/video\/download url script-response-body https://raw.githubusercontent.com/xchun5678/quantumultx/main/rednote-comment-fix-qx.js

hostname = ci.xiaohongshu.com, ci.rnote.com, edith.rnote.com, rec.rnote.com, so.rnote.com, www.rnote.com, music.rnote.com, *.xhscdn.com, *.rednotecan.com
